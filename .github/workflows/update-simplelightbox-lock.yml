name: Update SimpleLightbox lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-simplelightbox-lock.yml'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install SimpleLightbox
        run: npm install simplelightbox@2.14.3

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Install SimpleLightbox" || exit 0
          git push
